[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fantasy-football-analytics"
version = "0.1.0"
description = "Fantasy football data scraper and analytics."
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "requests>=2.31",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
