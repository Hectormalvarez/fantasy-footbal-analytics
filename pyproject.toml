[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-football-analytics"
version = "0.1.0"
description = "Fantasy football draft analytics engine"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "nbformat>=5.7",
    "nbconvert>=7.0",
]
visuals = [
    "matplotlib>=3.7",
]
all = [
    "matplotlib>=3.7",
]

[project.scripts]
ffa = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "network: marks tests that require live Sleeper API access (deselect with '-m not network')",
]
