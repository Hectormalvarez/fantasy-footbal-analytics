[project]
name = "fantasy-football-analytics"
version = "0.1.0"
description = "Fantasy football draft analytics engine"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "nflreadpy>=0.1",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
